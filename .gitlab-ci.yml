stages:
  - deploy

default:
  tags:
    - homelab

variables:
  REGISTRY: "10.0.0.7:30500"
  KUBECONFIG_PATH: "/root/.kube/talos-homelab.kubeconfig"

deploy:
  stage: deploy
  script:
    - docker build -f backend/Dockerfile.prod -t ${REGISTRY}/zenail-backend:latest ./backend
    - docker build -f frontend/Dockerfile.prod -t ${REGISTRY}/zenail-frontend:latest ./frontend
    - docker push ${REGISTRY}/zenail-backend:latest
    - docker push ${REGISTRY}/zenail-frontend:latest
    - kubectl --kubeconfig ${KUBECONFIG_PATH} delete job zenail-migrate -n zenail --ignore-not-found
    - |
      cat <<EOF | kubectl --kubeconfig ${KUBECONFIG_PATH} apply -f -
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: zenail-migrate
        namespace: zenail
      spec:
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: migrate
                image: ${REGISTRY}/zenail-backend:latest
                imagePullPolicy: Always
                command: ["uv", "run", "alembic", "upgrade", "head"]
                envFrom:
                  - secretRef:
                      name: zenail-secrets
      EOF
    - kubectl --kubeconfig ${KUBECONFIG_PATH} wait --for=condition=complete job/zenail-migrate -n zenail --timeout=120s
    - kubectl --kubeconfig ${KUBECONFIG_PATH} logs job/zenail-migrate -n zenail
    - kubectl --kubeconfig ${KUBECONFIG_PATH} set image deployment/backend backend=${REGISTRY}/zenail-backend:latest -n zenail
    - kubectl --kubeconfig ${KUBECONFIG_PATH} set image deployment/frontend frontend=${REGISTRY}/zenail-frontend:latest -n zenail
    - kubectl --kubeconfig ${KUBECONFIG_PATH} rollout status deployment/backend -n zenail --timeout=120s
    - kubectl --kubeconfig ${KUBECONFIG_PATH} rollout status deployment/frontend -n zenail --timeout=120s
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
